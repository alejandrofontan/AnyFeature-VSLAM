%YAML:1.0

# sift128 parameters

# Feature Extractor 
FeatureExtractor.nOctaves: 4
FeatureExtractor.scaleFactor: 2.0
FeatureExtractor.detectTh: 0.0066
FeatureExtractor.maxNumFeatures: 2000

# Feature Matcher 
FeatureMatcher.TH_LOW: 0.5
FeatureMatcher.TH_HIGH: 0.63
FeatureMatcher.descDistTh_high_reloc: 0.5
FeatureMatcher.descDistTh_low_reloc: 0.5
